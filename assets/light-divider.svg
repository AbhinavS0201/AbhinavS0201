<svg width="100%" height="10" viewBox="0 0 1200 10" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FF3B3B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="55%" stop-color="#FF3B3B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="4" width="1200" height="2" fill="#21262D"/>

  <rect x="-300" y="0" width="300" height="10" fill="url(#beam)" filter="url(#glow)">
    <animate attributeName="x" from="-300" to="1200" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
